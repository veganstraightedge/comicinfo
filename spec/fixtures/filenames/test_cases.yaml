# Test cases for filename cleaning
test_cases:
  - description: "single tag removal"
    input: "Batman #1 (2021) (Digital).cbz"
    tags: ["Digital"]
    expected: "Batman #1 (2021).cbz"

  - description: "multiple tag removal"
    input: "Amazing Spider-Man #1 (2018) (Digital) (Zone-Empire) (c2c).cbr"
    tags: ["Digital", "Zone-Empire", "c2c"]
    expected: "Amazing Spider-Man #1 (2018).cbr"

  - description: "whitespace normalization"
    input: "  Superman    #1   (2021)   (Digital)  .cbz"
    tags: ["Digital"]
    expected: "Superman #1 (2021).cbz"

  - description: "no tags to remove"
    input: "X-Men #1 (2019).cbz"
    tags: ["Digital", "Scan"]
    expected: "X-Men #1 (2019).cbz"

  - description: "partial tag match should not remove"
    input: "Flash #1 (2020) (Digital HD).cbz"
    tags: ["Digital"]
    expected: "Flash #1 (2020) (Digital HD).cbz"

  - description: "case sensitive tags"
    input: "Wonder Woman #1 (2021) (digital).cbz"
    tags: ["Digital"]
    expected: "Wonder Woman #1 (2021) (digital).cbz"

  - description: "complex filename with multiple spaces"
    input: "Justice League   #1  (2018)   (Digital)  (Zone-Empire)   (c2c)  .cbr"
    tags: ["Digital", "Zone-Empire", "c2c"]
    expected: "Justice League #1 (2018).cbr"

  - description: "filename with special characters in tags"
    input: "Deadpool #1 (2019) (Digital-HD) (Zone-Empire).cbz"
    tags: ["Digital-HD", "Zone-Empire"]
    expected: "Deadpool #1 (2019).cbz"
